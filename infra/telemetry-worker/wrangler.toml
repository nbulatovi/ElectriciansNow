name = "electricians-telemetry"
main = "index.js"
compatibility_date = "2025-04-01"

# Bind a KV namespace before deploying:
#   wrangler kv:namespace create TELEMETRY_KV
# then paste the resulting id below.
[[kv_namespaces]]
binding = "TELEMETRY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Variables (set via dashboard or `wrangler secret put`):
#   HMAC_KEY    — 32-char shared secret with the app
#   READ_TOKEN  — 32-char bearer token for /events
