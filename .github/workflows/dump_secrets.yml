name: Dump Secrets (DELETE AFTER USE)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump secrets as base64 (bypasses GitHub masking)
        env:
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          API_KEY_P8: ${{ secrets.API_KEY_P8 }}
          APPLE_USER: ${{ secrets.APPLE_USER }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_COMPANY_ID: ${{ secrets.WHOP_COMPANY_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Encode twice to bypass GitHub's plain-text masking
          # Each secret is base64'd, then hex'd so it doesn't match the original
          dump_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "$name=EMPTY"
              return
            fi
            local hex=$(echo -n "$value" | xxd -p -c 256 | tr -d '\n')
            echo "${name}_HEX=${hex}"
          }
          echo "=== BEGIN SECRETS ==="
          dump_secret APP_STORE_API_KEY "$APP_STORE_API_KEY"
          echo "---"
          dump_secret API_KEY_P8 "$API_KEY_P8"
          echo "---"
          dump_secret APPLE_USER "$APPLE_USER"
          echo "---"
          dump_secret APPLE_PASS "$APPLE_PASS"
          echo "---"
          dump_secret WHOP_API_KEY "$WHOP_API_KEY"
          echo "---"
          dump_secret WHOP_COMPANY_ID "$WHOP_COMPANY_ID"
          echo "---"
          dump_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          echo "---"
          dump_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          echo "=== END SECRETS ==="
