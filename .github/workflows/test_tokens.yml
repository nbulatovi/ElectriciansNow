name: Test OAuth Token Embedding

on:
  workflow_dispatch:

jobs:
  test-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install cryptography requests

      - name: Check and Obtain Tokens
        id: tokens
        env:
          INTUIT_ACCESS_TOKEN: ${{ secrets.INTUIT_ACCESS_TOKEN }}
          INTUIT_REFRESH_TOKEN: ${{ secrets.INTUIT_REFRESH_TOKEN }}
          INTUIT_CLIENT_ID: ${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
          INTUIT_USERNAME: ${{ secrets.INTUIT_USERNAME }}
          INTUIT_PASSWORD: ${{ secrets.INTUIT_PASSWORD }}
        run: |
          echo "Checking secrets status..."
          echo ""

          # Check what we have
          HAS_TOKENS=false
          HAS_CREDENTIALS=false

          if [ -n "$INTUIT_ACCESS_TOKEN" ] && [ -n "$INTUIT_REFRESH_TOKEN" ]; then
            echo "✓ INTUIT_ACCESS_TOKEN is set (${#INTUIT_ACCESS_TOKEN} chars)"
            echo "✓ INTUIT_REFRESH_TOKEN is set (${#INTUIT_REFRESH_TOKEN} chars)"
            HAS_TOKENS=true
          else
            echo "✗ INTUIT_ACCESS_TOKEN: $([ -n "$INTUIT_ACCESS_TOKEN" ] && echo "set (${#INTUIT_ACCESS_TOKEN} chars)" || echo "NOT SET")"
            echo "✗ INTUIT_REFRESH_TOKEN: $([ -n "$INTUIT_REFRESH_TOKEN" ] && echo "set (${#INTUIT_REFRESH_TOKEN} chars)" || echo "NOT SET")"
          fi

          echo "✓ INTUIT_CLIENT_ID: $([ -n "$INTUIT_CLIENT_ID" ] && echo "set (${#INTUIT_CLIENT_ID} chars)" || echo "NOT SET")"
          echo "✓ INTUIT_CLIENT_SECRET: $([ -n "$INTUIT_CLIENT_SECRET" ] && echo "set (${#INTUIT_CLIENT_SECRET} chars)" || echo "NOT SET")"

          if [ -n "$INTUIT_USERNAME" ] && [ -n "$INTUIT_PASSWORD" ]; then
            echo "✓ INTUIT_USERNAME is set"
            echo "✓ INTUIT_PASSWORD is set"
            HAS_CREDENTIALS=true
          fi

          echo ""

          if [ "$HAS_TOKENS" = "true" ]; then
            echo "Using existing tokens from secrets"
            echo "ACCESS_TOKEN=$INTUIT_ACCESS_TOKEN" >> $GITHUB_OUTPUT
            echo "REFRESH_TOKEN=$INTUIT_REFRESH_TOKEN" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No tokens in secrets. Attempting headless OAuth..."

          if [ -z "$INTUIT_CLIENT_ID" ] || [ -z "$INTUIT_CLIENT_SECRET" ]; then
            echo "ERROR: INTUIT_CLIENT_ID and INTUIT_CLIENT_SECRET are required"
            exit 1
          fi

          if [ "$HAS_CREDENTIALS" = "false" ]; then
            echo ""
            echo "========================================="
            echo "MANUAL SETUP REQUIRED"
            echo "========================================="
            echo ""
            echo "To get OAuth tokens, either:"
            echo ""
            echo "Option 1: Add tokens directly (recommended)"
            echo "  1. Go to: https://developer.intuit.com/app/developer/playground"
            echo "  2. Select your app and authorize"
            echo "  3. Copy access_token and refresh_token"
            echo "  4. Add as GitHub secrets:"
            echo "     - INTUIT_ACCESS_TOKEN"
            echo "     - INTUIT_REFRESH_TOKEN"
            echo ""
            echo "Option 2: Add Intuit credentials for automation"
            echo "  Add these GitHub secrets:"
            echo "     - INTUIT_USERNAME (your Intuit email)"
            echo "     - INTUIT_PASSWORD (your Intuit password)"
            echo "  Note: May fail if 2FA/CAPTCHA is required"
            echo ""
            exit 1
          fi

          # Try headless OAuth
          python scripts/oauth_headless.py

          if [ $? -ne 0 ]; then
            echo ""
            echo "Headless OAuth failed. Please add tokens manually."
            exit 1
          fi

      - name: Generate Encryption Key
        id: genkey
        run: |
          KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "::add-mask::$KEY"
          echo "TOKEN_ENCRYPTION_KEY=$KEY" >> $GITHUB_OUTPUT
          echo "✓ Generated encryption key"

      - name: Embed OAuth Tokens
        env:
          INTUIT_ACCESS_TOKEN: ${{ steps.tokens.outputs.ACCESS_TOKEN || secrets.INTUIT_ACCESS_TOKEN }}
          INTUIT_REFRESH_TOKEN: ${{ steps.tokens.outputs.REFRESH_TOKEN || secrets.INTUIT_REFRESH_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ steps.genkey.outputs.TOKEN_ENCRYPTION_KEY }}
        run: |
          python scripts/embed_tokens.py

          if [ -f "Resources/initial_tokens.enc" ]; then
            echo "✓ Token bundle created ($(stat -c%s Resources/initial_tokens.enc) bytes)"
          else
            echo "ERROR: Token bundle was not created"
            exit 1
          fi

      - name: Test Token Decryption
        env:
          TOKEN_ENCRYPTION_KEY: ${{ steps.genkey.outputs.TOKEN_ENCRYPTION_KEY }}
          INTUIT_CLIENT_ID: ${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
        run: |
          python -c "
          from intuit_oauth import IntuitTokenManager
          import time

          manager = IntuitTokenManager()
          tokens = manager._load_embedded_tokens()

          if not tokens:
              print('ERROR: Failed to decrypt tokens')
              exit(1)

          print('✓ Token decryption successful')
          print(f'  Access token: {len(tokens.access_token)} chars')
          print(f'  Refresh token: {len(tokens.refresh_token)} chars')
          print(f'  Refresh expires in: {(tokens.refresh_expires_at - time.time()) / 86400:.0f} days')
          "

      - name: Test Token Refresh with Intuit API
        env:
          TOKEN_ENCRYPTION_KEY: ${{ steps.genkey.outputs.TOKEN_ENCRYPTION_KEY }}
          INTUIT_CLIENT_ID: ${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
        run: |
          python -c "
          from intuit_oauth import IntuitTokenManager

          manager = IntuitTokenManager()
          tokens = manager._load_embedded_tokens()

          print('Testing token refresh with Intuit API...')
          try:
              new_tokens = manager._refresh_access_token(tokens.refresh_token)
              print('✓ Token refresh successful!')
              print(f'  New access token: {len(new_tokens.access_token)} chars')
          except Exception as e:
              print(f'ERROR: {e}')
              exit(1)
          "

      - name: Summary
        run: |
          echo ""
          echo "========================================="
          echo "ALL TESTS PASSED"
          echo "========================================="
          echo "✓ Tokens available"
          echo "✓ Encryption working"
          echo "✓ Intuit API refresh working"
          echo ""
          echo "Ready for production builds!"
