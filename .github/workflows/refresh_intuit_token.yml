name: Refresh Intuit OAuth Token

on:
  schedule:
    # Run at 6 AM UTC on 1st and 15th of each month
    - cron: '0 6 1,15 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Intuit OAuth Token
        id: refresh
        env:
          INTUIT_CLIENT_ID: ${{ secrets.INTUIT_CLIENT_ID }}
          INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
          INTUIT_REFRESH_TOKEN: ${{ secrets.INTUIT_REFRESH_TOKEN }}
        run: |
          # Encode credentials for Basic auth
          CREDENTIALS=$(echo -n "$INTUIT_CLIENT_ID:$INTUIT_CLIENT_SECRET" | base64)

          # Call Intuit token refresh endpoint
          RESPONSE=$(curl -s -X POST \
            "https://oauth.platform.intuit.com/oauth2/v1/tokens/bearer" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: Basic $CREDENTIALS" \
            -d "grant_type=refresh_token&refresh_token=$INTUIT_REFRESH_TOKEN")

          # Check for errors
          ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
          if [ -n "$ERROR" ]; then
            echo "Token refresh failed: $ERROR"
            echo "$RESPONSE" | jq -r '.error_description // empty'
            exit 1
          fi

          # Extract new tokens
          NEW_ACCESS=$(echo "$RESPONSE" | jq -r '.access_token')
          NEW_REFRESH=$(echo "$RESPONSE" | jq -r '.refresh_token')
          EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.expires_in')
          REFRESH_EXPIRES_IN=$(echo "$RESPONSE" | jq -r '.x_refresh_token_expires_in')

          # Validate tokens were returned
          if [ "$NEW_ACCESS" = "null" ] || [ -z "$NEW_ACCESS" ]; then
            echo "No access token in response"
            exit 1
          fi

          # Mask tokens in logs
          echo "::add-mask::$NEW_ACCESS"
          echo "::add-mask::$NEW_REFRESH"

          # Export for next step
          echo "NEW_ACCESS_TOKEN=$NEW_ACCESS" >> $GITHUB_OUTPUT
          echo "NEW_REFRESH_TOKEN=$NEW_REFRESH" >> $GITHUB_OUTPUT

          echo "Token refresh successful"
          echo "Access token expires in: $EXPIRES_IN seconds"
          echo "Refresh token expires in: $REFRESH_EXPIRES_IN seconds (~$(($REFRESH_EXPIRES_IN / 86400)) days)"

      - name: Update Access Token Secret
        uses: gliech/create-github-secret-action@v1
        with:
          name: INTUIT_ACCESS_TOKEN
          value: ${{ steps.refresh.outputs.NEW_ACCESS_TOKEN }}
          pa_token: ${{ secrets.GH_PAT_SECRETS }}

      - name: Update Refresh Token Secret
        uses: gliech/create-github-secret-action@v1
        with:
          name: INTUIT_REFRESH_TOKEN
          value: ${{ steps.refresh.outputs.NEW_REFRESH_TOKEN }}
          pa_token: ${{ secrets.GH_PAT_SECRETS }}

      - name: Notify Success
        run: |
          echo "Successfully refreshed Intuit OAuth tokens"
          echo "Secrets updated: INTUIT_ACCESS_TOKEN, INTUIT_REFRESH_TOKEN"
